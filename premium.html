<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Card - MMR Cooking</title>
     <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
     <style>
        /* Reset and global styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a; /* Dark sleek background */
}


/* Premium Card Design */
.premium-card {
  position: relative;
  width: 320px;
  padding: 30px;
  border-radius: 16px;
  background: linear-gradient(145deg, #1e293b, #0f172a);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color: #ffffff;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover Effect */
.premium-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
  border-color: rgba(99, 102, 241, 0.4);
}

/* Top Badge */
.badge {
  display: inline-block;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #6366f1;
  background: rgba(99, 102, 241, 0.15);
  border-radius: 20px;
  margin-bottom: 15px;
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 10px;
}

.description {
  font-size: 14px;
  color: #94a3b8;
  line-height: 1.5;
  margin-bottom: 20px;
}

/* Pricing Section */
.price {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 25px;
  color: #f8fafc;
}

.price span {
  font-size: 14px;
  font-weight: 400;
  color: #64748b;
}

/* Premium Button */
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  cursor: pointer;
  transition: opacity 0.2s ease, transform 0.1s ease;
}

.btn:hover {
  opacity: 0.9;
}

.btn:active {
  transform: scale(0.98);
}
     </style>
</head>
<body>

  <div class="premium-card">
    <div class="badge">Pro Plan</div>
    <h2 class="title">Premium Membership</h2>
    <p class="description">Unlock full access to all exclusive features, priority support, and custom themes.</p>
    <div class="price">$29<span>/month</span></div>
    <a href="preminmdetials.html" class="btn btn-primary">Get Started</a>
  </div>
</body>
</html>
